<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00122e">
  <title>Essential Breathing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <section id="main-screen" class="screen main-screen">
      <button id="settings-button" class="icon-button settings-button" type="button" aria-label="Settings">
        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <circle cx="32" cy="32" r="10"></circle>
          <path d="M32 8 V17"></path>
          <path d="M32 47 V56"></path>
          <path d="M8 32 H17"></path>
          <path d="M47 32 H56"></path>
          <path d="M15 15 L21 21"></path>
          <path d="M43 43 L49 49"></path>
          <path d="M49 15 L43 21"></path>
          <path d="M21 43 L15 49"></path>
        </svg>
      </button>

      <div id="pause-panel" class="pause-panel" hidden>
        <div id="pause-progress-label" class="pause-progress-label">0:00 / 5:00</div>
        <div class="session-progress" aria-hidden="true">
          <div id="session-progress-fill" class="session-progress-fill"></div>
        </div>
      </div>

      <div class="gauge-area" aria-label="Breathing guide">
        <svg id="breathing-gauge" class="breathing-gauge" viewBox="0 0 100 520" role="img" aria-labelledby="gauge-title">
          <title id="gauge-title">Breathing gauge</title>
          <rect class="gauge-capsule" x="0" y="0" width="100" height="520" rx="50" ry="50"></rect>
          <circle id="breathing-ball" class="breathing-ball" cx="50" cy="470" r="50"></circle>
        </svg>
      </div>

      <div class="bottom-controls" aria-label="Session controls">
        <button id="stop-button" class="control-button stop-button" type="button" aria-label="Stop" hidden>
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <rect x="20" y="20" width="24" height="24" rx="3"></rect>
          </svg>
        </button>
        <button id="start-button" class="control-button start-button" type="button" aria-label="Start">
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <path d="M23 17 L49 32 L23 47 Z"></path>
          </svg>
        </button>
      </div>

      <button id="running-touch-area" class="running-touch-area" type="button" aria-label="Pause session" hidden></button>
    </section>

    <section id="settings-screen" class="screen settings-screen" hidden>
      <header class="settings-header">
        <button id="back-button" class="settings-icon-button" type="button" aria-label="Back">
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <path d="M39 16 L23 32 L39 48"></path>
          </svg>
        </button>
        <h1 id="settings-title">Settings</h1>
      </header>

      <div class="settings-content">
        <h2 id="breathing-section-title">Breathing</h2>

        <div class="setting-row">
          <label id="inhale-label" for="inhale-plus">Inhale</label>
          <div class="stepper">
            <button id="inhale-minus" type="button" aria-label="Decrease inhale duration">−</button>
            <output id="inhale-value">4.0s</output>
            <button id="inhale-plus" type="button" aria-label="Increase inhale duration">+</button>
          </div>
        </div>

        <div class="setting-row">
          <label id="exhale-label" for="exhale-plus">Exhale</label>
          <div class="stepper">
            <button id="exhale-minus" type="button" aria-label="Decrease exhale duration">−</button>
            <output id="exhale-value">4.0s</output>
            <button id="exhale-plus" type="button" aria-label="Increase exhale duration">+</button>
          </div>
        </div>

        <div class="slider-block">
          <div class="slider-header">
            <label id="session-duration-label" for="session-duration-slider">Session duration</label>
            <output id="session-duration-value">5 min</output>
          </div>
          <input id="session-duration-slider" type="range" min="1" max="60" step="1" value="5">
        </div>

        <h2 id="themes-section-title">Themes</h2>

        <div class="theme-picker">
          <button id="previous-theme-button" type="button" aria-label="Previous theme">‹</button>
          <output id="theme-name">Ocean</output>
          <button id="next-theme-button" type="button" aria-label="Next theme">›</button>
        </div>
      </div>
    </section>

    <div id="completion-overlay" class="completion-overlay" aria-hidden="true">
      <div id="completion-message" class="completion-message">Session completed</div>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
